<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARTSnIDEAS — DJ Collombo</title>
<link rel="stylesheet" href="arts.css">
</head>

<body>

<!-- LOADER -->
<div id="loader">🔥 Loading Collombo Visual Universe...</div>


<!-- HEADER -->
<header class="glass-header">
  <h2>🎧 DJ COLLOMBO™</h2>
  <div class="controls">
    <button onclick="filterCategory('all')">All</button>
    <button onclick="filterCategory('memes')">Memes</button>
    <button onclick="filterCategory('art')">Art</button>
    <button onclick="filterCategory('ai')">AI</button>
    <button onclick="filterCategory('worship')">Worship</button>
    <button onclick="filterCategory('graffiti')">Graffiti</button>
    <button onclick="filterCategory('logos')">Logos</button>
    <button onclick="filterCategory('wallpapers')">Wallpapers</button>
    <button onclick="filterCategory('motivational')">Motivation</button>
    <button onclick="filterCategory('cars')">Cars</button>
    <button onclick="filterCategory('nature')">Nature/Environment</button>
    <button onclick="filterCategory('clothes')">Mens Fashion</button>
    <button onclick="sortByLikes()">🔥 Trending</button>
  </div>
</header>
<section class="hero-title">
  <h1>SnapyBox</h1>
  <p>Where Art Meets Vision</p>
</section>
<input type="text" id="searchInput" placeholder="🔍 Search images..." class="search-box">

<!-- FEED -->
<div class="masonry-feed" id="feed"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  
  <span class="close" onclick="closeModal()">&times;</span>

  <button class="nav prev" onclick="prevPost()">🌜</button>

  <div class="modal-box">
    <div id="modalContent"></div>
  </div>

  <button class="nav next" onclick="nextPost()">🌛</button>

</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- FOOTER -->
<footer>
  <p>🔥 DJ Collombo Media Hub</p>
  <div class="footer-links">
    <a href="Portfolio.html">Home</a>
    <a href="music.html">Music</a>
    <a href="arts.html">Gallery</a>
    <a href="booking.html">Bookings</a>

  </div>
  <div class="apple-frame">
    <p class="muted">© 2026 Collins — Zj-Loc. All rights reserved.</p></div>
  
</footer>

<script src="arts.js"></script>

</div>
</body>
</html>
