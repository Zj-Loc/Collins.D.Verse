<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You!</title>

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #0ff;
      text-align: center;
      position: relative;
    }

    /* 🌌 Galaxy Stars */
    .stars {
      width: 100%;
      height: 100%;
      background: url('https://www.transparenttextures.com/patterns/stardust.png');
      position: absolute;
      top: 0;
      left: 0;
      animation: drift 60s linear infinite;
      opacity: 0.35;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-2000px); }
    }

    /* 🌌 Nebula Glow */
    .nebula {
      position: absolute;
      width: 140%;
      height: 140%;
      background: radial-gradient(circle at center, rgba(90,0,150,0.6), rgba(0,0,0,0.9));
      filter: blur(60px);
      animation: pulse 8s infinite alternate;
      z-index: -1;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }

    /* 🟩 Matrix Rain */
    canvas#matrix {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0.28; /* subtle */
      mix-blend-mode: lighten;
      pointer-events: none;
    }

    h1 {
      font-size: 2.6em;
      text-shadow: 0 0 15px #0ff;
      margin-bottom: 8px;
      z-index: 10;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 18px;
      z-index: 10;
    }

    a {
      color: #0ff;
      border: 1px solid #0ff;
      padding: 10px 22px;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;
      z-index: 10;
    }

    a:hover {
      background: #0ff;
      color: #000;
      box-shadow: 0 0 20px #0ff;
    }

  </style>
</head>
<body>

  <!-- Galaxy Layers -->
  <div class="nebula"></div>
  <div class="stars"></div>

  <!-- Matrix Canvas -->
  <canvas id="matrix"></canvas>

  <h1>✅ Message Successfully Delivered!</h1>
  <p>Thank you for reaching out.Zj will get back to you A.S.A.P 😎</p>

  <a href="https://zj-loc.github.io/Collins.D.Verse/">← Back to Col.D.Verse</a>

  <!-- MATRIX SCRIPT -->
  <script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;

    const matrixChars = "01XZJL$@#ΦΩΨ";
    const chars = matrixChars.split("");

    const fontSize = 14;
    const columns = canvas.width / fontSize;

    const drops = [];
    for (let i = 0; i < columns; i++) drops[i] = 1;

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#00ff66";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.95) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(drawMatrix, 45);
  </script>

</body>
</html>
